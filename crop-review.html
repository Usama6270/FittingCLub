<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crop vs Full Review</title>
  <link rel="stylesheet" href="assets/css/style.css" />
  <style>
    body { background: #f7f7f7; color: #111; font-family: Inter, sans-serif; }
    .review-shell { max-width: 1600px; margin: 0 auto; padding: 2rem 1.25rem 4rem; }
    .review-grid { display: grid; gap: 1.5rem; }
    .review-card { background: #fff; border: 1px solid #e5e5e5; border-radius: 18px; padding: 1rem; box-shadow: 0 8px 25px rgba(0,0,0,.04); }
    .review-header { display: flex; justify-content: space-between; gap: 1rem; align-items: center; margin-bottom: .75rem; }
    .review-product-name { font-size: 1.1rem; font-weight: 700; margin: 0; }
    .review-images { display: grid; grid-template-columns: repeat(2, minmax(220px, 1fr)); gap: 1rem; }
    .review-image-box { background: #f3f3f3; border: 1px solid #ddd; border-radius: 12px; overflow: hidden; }
    .review-image-box img { width: 100%; height: 320px; object-fit: contain; display: block; background: #fff; }
    .review-label { display: inline-block; padding: .4rem .7rem; background: #111; color: #fff; font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; font-weight: 700; }
    @media (max-width: 767px) { .review-images { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="review-shell">
    <h1 style="font-family:'Bebas Neue',sans-serif; letter-spacing:.08em; margin-bottom:1rem; font-size: clamp(2rem, 4vw, 3.5rem);">Crop vs Full Review</h1>
    <div id="review-root" class="review-grid"></div>
  </div>

  <script src="assets/js/products-data.js"></script>
  <script>
    const root = document.getElementById('review-root');
    const products = window.productsData || [];
    products.forEach((product) => {
      const images = Array.isArray(product.images) ? product.images.slice(0, 2) : [];
      if (!images.length) return;
      const card = document.createElement('div');
      card.className = 'review-card';
      card.innerHTML = `
        <div class="review-header">
          <h2 class="review-product-name">${(product.name || 'Product')}</h2>
          <span class="review-label">manual review</span>
        </div>
        <div class="review-images">
          <div class="review-image-box">
            <span class="review-label">Crop</span>
            <img src="${images[0]}" alt="${product.name || 'Product'} crop image" />
          </div>
          <div class="review-image-box">
            <span class="review-label">Full</span>
            <img src="${images[1] || images[0]}" alt="${product.name || 'Product'} full image" />
          </div>
        </div>
      `;
      root.appendChild(card);
    });
  </script>
</body>
</html>
